# Weekly update checks. Each ecosystem opens one grouped pull request, so the list stays short.
# CI runs every check on these pull requests; nothing merges by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /react
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
