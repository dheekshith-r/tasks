name: Test and deploy to GitHub Pages

# Tests run on every push and pull request; only main deploys.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; only the deploy job can write to Pages.
permissions:
  contents: read

# One run per branch. A newer push cancels an older branch run, but never a running deploy of main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20 # the start page lists the latest commits
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      # Firestore security rules run against the emulator, which needs Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run contrast
      # The Firebase web config comes from repository variables (Settings > Secrets and
      # variables > Actions > Variables). Without them the build is guest-only.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - run: npm run csp
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: react/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
