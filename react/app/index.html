<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
  <title>Tasks</title>
  <meta name="description" content="Your Tasks list. Type &quot;Pay rent friday !high #home&quot; and it sets the date, the priority and the list.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://dheekshith-r.github.io/tasks/app/">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <!-- The production build adds a Content-Security-Policy meta tag here (see vite.config.ts). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161616'/%3E%3Cpath d='M16 4v24M4 16h24' stroke='%23fff' stroke-width='3'/%3E%3Crect x='19' y='7' width='7' height='7' fill='%23D62839'/%3E%3C/svg%3E">
  <!-- Set the theme before first paint so dark-mode users never see a light flash -->
  <script>
    try {
      var t = localStorage.getItem('todo-theme');
      document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { /* storage blocked: the app sets the theme once it loads */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
